<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Room (2 people)</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root { color-scheme: dark; --bg:#111; --panel:#1b1b1b; --line:#333; --fg:#eee; --mute:#999; --accent:#3b82f6; --bad:#ef4444; --ok:#22c55e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  main { flex:1; padding:16px; display:flex; flex-direction:column; gap:12px; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:9px 14px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.off { background:var(--bad); border-color:var(--bad); color:#fff; }
  #lobby { margin:auto; text-align:center; max-width:420px; display:flex; flex-direction:column; gap:14px; }
  #room, #linkbox { display:none; }
  #videos { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:12px; min-height:0; }
  @media (max-width:720px) { #videos { grid-template-columns:1fr; } }
  .tile { position:relative; background:#000; border:1px solid var(--line); border-radius:10px; overflow:hidden; min-height:220px; }
  .tile video { width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .tile span { position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,.6); padding:2px 8px; border-radius:6px; font-size:12px; }
  #controls { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #gateRow { display:none; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; color:var(--mute); font-size:13px; }
  #gateRow input { vertical-align:middle; }
  #stats { font:12px ui-monospace, Consolas, monospace; color:var(--mute); }
  #status { color:var(--mute); }
  #linkbox { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; gap:8px; align-items:center; }
  #linkbox input { flex:1; background:transparent; color:var(--fg); border:0; font:inherit; min-width:0; }
  .good { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Call Room &middot; max 2 people</h1>
  <div id="stats">not connected</div>
</header>
<main>
  <div id="lobby">
    <p>Free peer-to-peer call. Audio, video and screen share go directly between the two browsers.</p>
    <button class="primary" id="createBtn">Create room</button>
    <div id="lobbyMsg" class="bad"></div>
  </div>

  <div id="room">
    <div id="linkbox"><input id="linkInput" readonly><button id="copyBtn">Copy link</button></div>
    <div id="status"></div>
    <div id="videos">
      <div class="tile"><video id="remoteVideo" autoplay playsinline></video><span>Them</span></div>
      <div class="tile"><video id="localVideo" autoplay playsinline muted></video><span>You</span></div>
    </div>
    <div id="controls">
      <button id="micBtn">Mute mic</button>
      <button id="rnnoiseBtn" class="primary">RNNoise: ON</button>
      <button id="gtcrnBtn">GTCRN: OFF</button>
      <button id="gateBtn">Noise gate: OFF</button>
      <button id="camBtn">Camera off</button>
      <button id="shareBtn">Share screen</button>
      <button id="leaveBtn">Leave</button>
    </div>
    <div id="gateRow"><label>Gate threshold <input type="range" id="gateSlider" min="-80" max="-20" step="1" value="-50"></label> <span id="gateVal">-50 dB</span> <span>&middot; your mic level: <b id="meter">--</b></span></div>
  </div>
</main>

<script src="config.js"></script>
<script type="module">
import { RnnoiseWorkletNode, loadRnnoise, GtcrnWorkletNode, loadGtcrn, NoiseGateWorkletNode } from './vendor/noise-suppressor.js';

(function () {
  'use strict';

  const ICE = { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ] };
  // signaling server settings come from config.js (null = the free public PeerJS server)
  const peerOpts = () => Object.assign({ config: ICE }, window.DUO_SIGNAL || {});
  const SCREEN_MAX_BITRATE = 2500000; // bits/s, keeps upload manageable
  const $ = id => document.getElementById(id);

  let peer = null, call = null, localStream = null, sendStream = null, cameraTrack = null, screenTrack = null;
  let audioCtx = null, micSource = null, denoiseDest = null;
  let statsTimer = null, prevBytes = null;
  const roomFromUrl = new URLSearchParams(location.search).get('room');

  function setStatus(t) { $('status').textContent = t; }
  function showRoom() { $('lobby').style.display = 'none'; $('room').style.display = 'flex'; $('room').style.flexDirection = 'column'; $('room').style.gap = '12px'; $('room').style.flex = '1'; }
  function randomId(len = 16) {
    const a = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = '';
    const r = crypto.getRandomValues(new Uint8Array(len));
    for (const b of r) s += a[b % a.length];
    return s;
  }

  async function getMedia() {
    if (localStream) return localStream;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }
      });
    } catch (e) {
      // fall back to audio only
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    }
    cameraTrack = localStream.getVideoTracks()[0] || null;
    $('localVideo').srcObject = localStream;
    sendStream = await buildSendStream();
    return localStream;
  }

  // Mic -> [RNNoise] -> [GTCRN] -> [noise gate] -> the track that is sent to the peer.
  // Each effect is an independent toggle and runs locally in this browser, so every person's
  // buttons control only how THEIR mic sounds to the other side. The sent track never changes;
  // toggling only re-routes the audio graph.
  const FX_ORDER = ['rnnoise', 'gtcrn', 'gate'];
  const FX_LABEL = { rnnoise: 'RNNoise', gtcrn: 'GTCRN', gate: 'Noise gate' };
  const fx = { rnnoise: { on: true, node: null }, gtcrn: { on: false, node: null }, gate: { on: false, node: null } };
  let gateDb = -50, analyser = null, meterTimer = null;

  async function buildSendStream() {
    const out = new MediaStream();
    if (cameraTrack) out.addTrack(cameraTrack);
    const mic = localStream.getAudioTracks()[0];
    if (!mic) return out;
    try {
      audioCtx = new AudioContext({ sampleRate: 48000, latencyHint: 'interactive' }); // the models need 48 kHz
      micSource = audioCtx.createMediaStreamSource(new MediaStream([mic]));
      denoiseDest = audioCtx.createMediaStreamDestination();
      denoiseDest.channelCount = 1;
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
      await audioCtx.resume();
      await rewire(); // loads RNNoise, which is on by default
      out.addTrack(denoiseDest.stream.getAudioTracks()[0]);
      startMeter();
    } catch (e) {
      console.warn('Noise processing unavailable, sending raw mic audio:', e);
      out.addTrack(mic);
      FX_ORDER.forEach(k => { const b = $(k + 'Btn'); b.disabled = true; b.textContent = FX_LABEL[k] + ': n/a'; b.classList.remove('primary'); });
    }
    return out;
  }

  async function loadNode(kind) {
    const f = fx[kind];
    if (f.node) return f.node;
    if (kind === 'rnnoise') {
      await audioCtx.audioWorklet.addModule('./vendor/rnnoise-worklet.js');
      const wasmBinary = await loadRnnoise({ url: './vendor/rnnoise.wasm', simdUrl: './vendor/rnnoise_simd.wasm' });
      f.node = new RnnoiseWorkletNode(audioCtx, { maxChannels: 1, wasmBinary });
    } else if (kind === 'gtcrn') {
      await audioCtx.audioWorklet.addModule('./vendor/gtcrn-worklet.js');
      const wasmBinary = await loadGtcrn({ url: './vendor/gtcrn.wasm' });
      f.node = new GtcrnWorkletNode(audioCtx, { maxChannels: 1, wasmBinary });
    } else {
      await audioCtx.audioWorklet.addModule('./vendor/noise-gate-worklet.js');
      f.node = new NoiseGateWorkletNode(audioCtx, { openThreshold: gateDb, closeThreshold: gateDb - 5, holdMs: 250, maxChannels: 1 });
    }
    f.node.channelCount = 1; f.node.channelCountMode = 'explicit';
    return f.node;
  }

  // Load whatever is switched on first, then re-wire the graph in one synchronous step.
  async function rewire() {
    const active = FX_ORDER.filter(k => fx[k].on);
    for (const k of active) await loadNode(k);
    micSource.disconnect(); analyser.disconnect();
    FX_ORDER.forEach(k => { if (fx[k].node) fx[k].node.disconnect(); });
    let prev = micSource;
    for (const k of active) {
      if (k === 'gate') prev.connect(analyser); // the meter shows the level the gate sees
      prev.connect(fx[k].node); prev = fx[k].node;
    }
    if (!fx.gate.on) prev.connect(analyser);
    prev.connect(denoiseDest);
    // browser suppression only when no ML model is active (avoids double processing)
    const ml = fx.rnnoise.on || fx.gtcrn.on;
    const mic = localStream.getAudioTracks()[0];
    try { await mic.applyConstraints({ noiseSuppression: !ml, echoCancellation: true, autoGainControl: true }); } catch (e) {}
  }

  function updateFxUi() {
    FX_ORDER.forEach(k => {
      const b = $(k + 'Btn'); if (b.disabled) return;
      b.textContent = FX_LABEL[k] + ': ' + (fx[k].on ? 'ON' : 'OFF');
      b.classList.toggle('primary', fx[k].on);
    });
    $('gateRow').style.display = fx.gate.on ? 'flex' : 'none';
  }

  async function toggleFx(kind) {
    const f = fx[kind];
    f.on = !f.on;
    try { await rewire(); }
    catch (e) {
      console.warn(FX_LABEL[kind] + ' failed to load:', e);
      f.on = false; f.node = null;
      setStatus(FX_LABEL[kind] + ' could not be loaded in this browser.');
      try { await rewire(); } catch (e2) {}
    }
    updateFxUi();
  }

  function startMeter() {
    const buf = new Float32Array(analyser.fftSize);
    meterTimer = setInterval(() => {
      if (!fx.gate.on) return;
      analyser.getFloatTimeDomainData(buf);
      let s = 0; for (const x of buf) s += x * x;
      const db = 10 * Math.log10(s / buf.length + 1e-12);
      const open = db > gateDb;
      $('meter').textContent = Math.max(-99, Math.round(db)) + ' dB ' + (open ? '(open)' : '(closed)');
      $('meter').className = open ? 'good' : 'bad';
    }, 150);
  }

  // ---- Fixed room: the same link every time ----
  // The room is a fixed peer ID derived from a secret in the link. Whoever arrives first claims it and
  // hosts; the other person calls it. If either side refreshes or drops, they reconnect on their own,
  // and if the host leaves the guest takes the room over. Only two people can be connected at once.
  const ROOM_KEY = 'duoRoomSecret';
  let roomPeerId = null, isHost = false, leaving = false, retryTimer = null;

  function later(ms) { clearTimeout(retryTimer); retryTimer = setTimeout(enter, ms); }

  function dropCall(c) {
    if (call !== c) return; // already replaced or dropped
    call = null;
    try { c.close(); } catch (e) {}
    stopStats();
    $('remoteVideo').srcObject = null;
    if (leaving) return;
    setStatus('The other person disconnected. Waiting for them to rejoin the same link...');
    if (!isHost) later(1000); // the guest re-enters, and becomes host if the room is free
  }

  // Reports what is stopping the media path: which kinds of network addresses this browser could find
  // (host = local, srflx = public via STUN, relay = via TURN) and the ICE state, then says what it means.
  let diagTimer = null;
  function startDiag(c) {
    clearInterval(diagTimer);
    const started = Date.now();
    const tick = async () => {
      if (call !== c || !c.peerConnection) { clearInterval(diagTimer); return; }
      const pc = c.peerConnection, s = pc.iceConnectionState;
      if (s === 'connected' || s === 'completed') { clearInterval(diagTimer); setStatus('Connected'); startStats(); return; }
      const types = new Set();
      try { (await pc.getStats()).forEach(r => { if (r.type === 'local-candidate') types.add(r.candidateType); }); } catch (e) {}
      $('stats').textContent = 'ICE ' + s + ' | my address types: ' + ([...types].join(', ') || 'none yet');
      if (s === 'failed' || Date.now() - started > 10000) {
        setStatus(types.has('srflx') || types.has('relay')
          ? 'Could not open a direct connection to the other person. A network or firewall on one side is blocking direct calls, and there is no relay server.'
          : 'This browser could not reach the public STUN servers (UDP looks blocked on this network), so a direct connection is not possible.');
      }
    };
    diagTimer = setInterval(tick, 1500); tick();
  }

  function attachCall(c) {
    call = c;
    c.on('stream', remote => {
      $('remoteVideo').srcObject = remote;
      setStatus('Found the other person, setting up the connection...');
      startDiag(c); // "Connected" is only shown once the network path is really up
    });
    c.on('close', () => dropCall(c));
    c.on('error', e => setStatus('Call error: ' + e.type));
    // PeerJS does not always notice when the other side refreshes, so watch the connection state too
    const watch = (tries) => {
      const pc = c.peerConnection;
      if (!pc) { if (tries < 5) setTimeout(() => watch(tries + 1), 300); return; }
      let t = null;
      pc.addEventListener('iceconnectionstatechange', () => {
        const s = pc.iceConnectionState;
        clearTimeout(t);
        if (s === 'failed' || s === 'closed') dropCall(c);
        else if (s === 'disconnected') t = setTimeout(() => dropCall(c), 5000);
      });
    };
    watch(0);
  }

  function enter() {
    if (leaving) return;
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    isHost = false;
    setStatus('Connecting...');
    const p = new Peer(roomPeerId, peerOpts());
    peer = p;
    p.on('open', () => {
      if (peer !== p) return;
      isHost = true;
      if (!call) setStatus('You are in the room. Waiting for the other person to open the same link...');
    });
    p.on('call', incoming => {
      if (peer !== p) return;
      if (call) {
        // a refreshed person reconnecting replaces the stale call; a healthy call is never displaced (2-person limit)
        const st = call.peerConnection && call.peerConnection.iceConnectionState;
        if (st === 'connected' || st === 'completed') { incoming.close(); return; }
        const old = call; call = null; try { old.close(); } catch (e) {}
      }
      incoming.answer(sendStream);
      attachCall(incoming);
    });
    p.on('disconnected', () => { if (peer === p && !leaving && !p.destroyed) p.reconnect(); });
    p.on('error', e => {
      if (peer !== p) return;
      if (e.type === 'unavailable-id') joinAsGuest();
      else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) { setStatus('Connection problem, retrying...'); later(3000); }
      else setStatus('Connection error: ' + e.type);
    });
  }

  function joinAsGuest() {
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    const p = new Peer(peerOpts());
    peer = p;
    p.on('open', () => {
      if (peer !== p) return;
      const c = p.call(roomPeerId, sendStream);
      attachCall(c);
      setStatus('Joining the room...');
      // no answer in time (busy room or a stale host): try again
      setTimeout(() => { if (call === c && !c.open) dropCall(c); }, 8000);
    });
    p.on('error', e => {
      if (peer !== p) return;
      const c = call; call = null; if (c) { try { c.close(); } catch (e2) {} }
      setStatus(e.type === 'peer-unavailable' ? 'Room is busy or the other person is reconnecting, retrying...' : 'Connection problem, retrying...');
      later(2000);
    });
  }

  function roomLink(secret) { return location.origin + location.pathname + '?room=' + secret; }

  async function enterRoom(secret) {
    $('lobbyMsg').textContent = '';
    try { await getMedia(); } catch (e) { $('lobbyMsg').textContent = 'Camera/mic blocked: ' + e.message; return; }
    roomPeerId = 'duocall-' + secret;
    try { localStorage.setItem(ROOM_KEY, secret); } catch (e) {}
    history.replaceState(null, '', '?room=' + secret);
    $('linkInput').value = roomLink(secret);
    $('linkbox').style.display = 'flex';
    showRoom();
    enter();
  }

  // ---- controls ----
  $('copyBtn').onclick = () => { navigator.clipboard.writeText($('linkInput').value); $('copyBtn').textContent = 'Copied'; setTimeout(() => $('copyBtn').textContent = 'Copy link', 1500); };

  $('micBtn').onclick = () => {
    const t = localStream && localStream.getAudioTracks()[0]; if (!t) return;
    t.enabled = !t.enabled;
    $('micBtn').textContent = t.enabled ? 'Mute mic' : 'Unmute mic';
    $('micBtn').classList.toggle('off', !t.enabled);
  };
  FX_ORDER.forEach(k => { $(k + 'Btn').onclick = () => toggleFx(k); });
  $('gateSlider').oninput = e => { gateDb = +e.target.value; $('gateVal').textContent = gateDb + ' dB'; };
  $('gateSlider').onchange = async () => { // the gate takes its threshold at creation, so rebuild it
    if (fx.gate.node) { fx.gate.node.disconnect(); fx.gate.node = null; }
    if (fx.gate.on) { try { await rewire(); } catch (e) {} }
  };
  $('camBtn').onclick = () => {
    if (!cameraTrack) return;
    cameraTrack.enabled = !cameraTrack.enabled;
    $('camBtn').textContent = cameraTrack.enabled ? 'Camera off' : 'Camera on';
    $('camBtn').classList.toggle('off', !cameraTrack.enabled);
  };

  function videoSender() {
    if (!call || !call.peerConnection) return null;
    return call.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video')
        || call.peerConnection.getSenders().find(s => s.track === null);
  }
  async function capBitrate(sender, bps) {
    const p = sender.getParameters(); if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = bps; try { await sender.setParameters(p); } catch (e) {}
  }
  async function startShare() {
    const sender = videoSender();
    if (!sender) { setStatus('Connect to the other person before sharing.'); return; }
    let s;
    try { s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: { ideal: 30 } }, audio: false }); }
    catch (e) { return; }
    screenTrack = s.getVideoTracks()[0];
    screenTrack.contentHint = 'detail';
    await sender.replaceTrack(screenTrack);
    await capBitrate(sender, SCREEN_MAX_BITRATE);
    $('localVideo').srcObject = s;
    $('shareBtn').textContent = 'Stop sharing'; $('shareBtn').classList.add('off');
    screenTrack.onended = stopShare;
  }
  async function stopShare() {
    if (!screenTrack) return;
    screenTrack.stop(); screenTrack = null;
    const sender = videoSender();
    if (sender && cameraTrack) { await sender.replaceTrack(cameraTrack); await capBitrate(sender, 2000000); }
    $('localVideo').srcObject = localStream;
    $('shareBtn').textContent = 'Share screen'; $('shareBtn').classList.remove('off');
  }
  $('shareBtn').onclick = () => screenTrack ? stopShare() : startShare();
  $('leaveBtn').onclick = () => { leaving = true; clearTimeout(retryTimer); if (call) call.close(); if (peer) peer.destroy(); if (localStream) localStream.getTracks().forEach(t => t.stop()); location.href = location.pathname; };

  // ---- connection stats: shows whether the path is direct and the round-trip time ----
  function startStats() { stopStats(); statsTimer = setInterval(readStats, 2000); readStats(); }
  function stopStats() { clearInterval(diagTimer); clearInterval(statsTimer); statsTimer = null; prevBytes = null; $('stats').textContent = 'not connected'; }
  async function readStats() {
    if (!call || !call.peerConnection) return;
    const report = await call.peerConnection.getStats();
    let pair = null; const cands = {}; let bytes = 0;
    report.forEach(r => {
      if (r.type === 'candidate-pair' && (r.nominated || r.selected) && r.state === 'succeeded') pair = r;
      if (r.type === 'local-candidate' || r.type === 'remote-candidate') cands[r.id] = r;
      if (r.type === 'outbound-rtp' && r.kind === 'video') bytes += r.bytesSent || 0;
    });
    if (!pair) return;
    const l = cands[pair.localCandidateId], r = cands[pair.remoteCandidateId];
    const relayed = (l && l.candidateType === 'relay') || (r && r.candidateType === 'relay');
    const rtt = pair.currentRoundTripTime != null ? Math.round(pair.currentRoundTripTime * 1000) : null;
    let kbps = '';
    if (prevBytes != null) kbps = ' | up ' + Math.round((bytes - prevBytes) * 8 / 2000) + ' kbps';
    prevBytes = bytes;
    $('stats').innerHTML = (relayed ? '<span class="bad">RELAYED</span>' : '<span class="good">DIRECT</span>')
      + ' | RTT ' + (rtt != null ? rtt + ' ms' : '?') + kbps;
  }

  // close cleanly when the tab is refreshed or closed so the other person sees it straight away
  addEventListener('pagehide', () => { leaving = true; try { if (call) call.close(); if (peer) peer.destroy(); } catch (e) {} });

  // ---- entry ----
  const validSecret = v => /^[a-z0-9]{8,40}$/i.test(v || '');
  let savedSecret = null; try { savedSecret = localStorage.getItem(ROOM_KEY); } catch (e) {}
  if (validSecret(roomFromUrl)) {
    $('lobby').innerHTML = '<p>Your call room is ready. Use this same link every time.</p><button class="primary" id="enterBtn">Enter room</button><div id="lobbyMsg" class="bad"></div>';
    $('enterBtn').onclick = () => enterRoom(roomFromUrl);
  } else if (validSecret(savedSecret)) {
    $('lobby').innerHTML = '<p>Welcome back.</p><button class="primary" id="enterBtn">Enter my room</button><button id="newBtn">Make a new link instead</button><div id="lobbyMsg" class="bad"></div>';
    $('enterBtn').onclick = () => enterRoom(savedSecret);
    $('newBtn').onclick = () => enterRoom(randomId());
  } else {
    $('createBtn').textContent = 'Create my room link';
    $('createBtn').onclick = () => enterRoom(randomId());
  }
})();
</script>
</body>
</html>
